<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIUM TCG Card Maker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Beleren:wght@700&family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons & html2canvas -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Font styles */
    .font-card-title {
      font-family: 'Cinzel', 'Noto Serif KR', serif;
    }
    .font-card-type {
      font-family: 'Cinzel', 'Noto Serif KR', serif;
    }
    .font-card-body {
      font-family: 'Noto Serif KR', Georgia, serif;
    }
    .font-card-flavor {
      font-family: 'Noto Serif KR', Georgia, serif;
      font-style: italic;
    }

    /* Holographic Foil Shader Effect */
    .foil-hologram {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.4) 0%,
        rgba(255, 0, 128, 0.3) 25%,
        rgba(0, 255, 255, 0.4) 50%,
        rgba(255, 230, 0, 0.3) 75%,
        rgba(255, 255, 255, 0.4) 100%
      );
      background-size: 200% 200%;
      animation: foilSheen 6s ease-in-out infinite alternate;
    }

    @keyframes foilSheen {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* Core Mana/Energy Symbol - Circular 3D Orb */
    .mana-symbol {
      width: 22px;
      height: 22px;
      min-width: 22px;
      max-width: 22px;
      border-radius: 9999px;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.55), inset 0 -1.5px 2px rgba(0, 0, 0, 0.6);
      flex-shrink: 0 !important;
      user-select: none;
      vertical-align: middle;
      position: relative;
    }

    .mana-symbol-inline {
      width: 17px;
      height: 17px;
      min-width: 17px;
      max-width: 17px;
      border-radius: 9999px;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6), inset 0 0.8px 1px rgba(255, 255, 255, 0.5);
      flex-shrink: 0 !important;
      user-select: none;
      vertical-align: -3px !important;
      position: relative;
      margin: 0 1.5px !important;
      line-height: 1 !important;
    }

    /* Header Mana Cost Row */
    .mana-cost-group {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      white-space: nowrap !important;
      gap: 2px !important;
      flex-shrink: 0 !important;
    }

    /* Rules text inline symbols cluster */
    .mana-cluster-inline {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      white-space: nowrap !important;
      gap: 1.5px !important;
      margin: 0 2px !important;
      vertical-align: middle !important;
      flex-shrink: 0 !important;
    }

    /* Pokemon Skill Energy & Header Styles (Strict No-Wrap Rules) */
    .pokemon-energy-cost {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      white-space: nowrap !important;
      gap: 1.5px !important;
      flex-shrink: 0 !important;
    }
    .pokemon-energy-cost > * {
      display: inline-flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
    }
    .pokemon-energy-cost .mana-symbol-inline {
      flex-shrink: 0 !important;
      display: inline-flex !important;
      margin: 0 !important;
    }
    .pokemon-skill-header {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      gap: 6px !important;
      width: 100% !important;
    }

    /* Astral Filigree Frame Textures (CARD_FORM Style) */
    .astrum-marble-header {
      background-color: #dedad2;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(255, 255, 255, 0.65) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(160, 154, 145, 0.35) 0%, transparent 50%),
        linear-gradient(180deg, #ece9e2 0%, #dad5cc 52%, #c9c3b8 100%);
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.85),
        inset 0 1px 1px rgba(255, 255, 255, 0.8),
        inset 0 -1.5px 3px rgba(60, 52, 42, 0.35),
        inset 0 0 0 1.5px #1a1821;
    }

    .astrum-obsidian-bar {
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.9),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.22),
        inset 0 -2px 4px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1.2px #09080d;
    }

    .astrum-marble-box {
      background-color: #e3dfd7;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.7) 0%, transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(175, 169, 158, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 35% 78%, rgba(168, 162, 152, 0.28) 0%, transparent 52%),
        radial-gradient(circle at 78% 82%, rgba(255, 255, 255, 0.55) 0%, transparent 45%),
        linear-gradient(165deg, #ebe8e1 0%, #dfdbd2 48%, #d5d0c6 100%);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.28),
        inset 0 0 0 1.5px #1b1922,
        0 4px 12px rgba(0, 0, 0, 0.85);
    }

    .astrum-pt-plaque {
      background-color: #dfdbd2;
      background-image:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.75) 0%, transparent 60%),
        linear-gradient(180deg, #edeae4 0%, #d8d3c8 60%, #c4beb2 100%);
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.85),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.35),
        inset 0 0 0 1.5px #232029;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-black">

  <!-- Header / Navigation Bar -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 via-rose-600 to-amber-400 flex items-center justify-center shadow-lg shadow-rose-950/40">
          <i data-lucide="sparkles" class="w-5 h-5 text-zinc-950"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight font-card-title flex items-center gap-2">
            AETHERIUM <span class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-amber-400 border border-zinc-700">TCG MAKER</span>
          </h1>
          <p class="text-[11px] text-zinc-400 hidden sm:block">전설적 크리처 & 배틀 스킬 카드 에디터</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnDownload" onclick="downloadCard()" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 text-xs font-bold rounded-lg shadow-md transition flex items-center gap-1.5 active:scale-95">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>카드 다운로드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

    <!-- Left Column: Form Controls (7 cols on lg) -->
    <div class="lg:col-span-7 space-y-5 order-2 lg:order-1">

      <!-- 1. Attribute / Theme Selector -->
      <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 sm:p-5 shadow-lg">
        <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3 flex items-center gap-2">
          <i data-lucide="palette" class="w-4 h-4 text-amber-400"></i>
          카드 속성 선택 (7 ELEMENTS)
        </h2>
        <div id="colorSelectors" class="grid grid-cols-4 sm:grid-cols-7 gap-1.5">
          <button type="button" data-color="IGNIS" onclick="selectColor('IGNIS')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-red-950/80 border border-red-700/80 text-red-200 hover:bg-red-900 transition flex flex-col items-center gap-1 ring-2 ring-white">
            <span class="w-3.5 h-3.5 rounded-full bg-red-500 shadow-sm"></span>
            <span>IGNIS</span>
          </button>
          <button type="button" data-color="AQUA" onclick="selectColor('AQUA')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-cyan-950/80 border border-cyan-700/80 text-cyan-200 hover:bg-cyan-900 transition flex flex-col items-center gap-1">
            <span class="w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-sm"></span>
            <span>AQUA</span>
          </button>
          <button type="button" data-color="VERDANT" onclick="selectColor('VERDANT')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-emerald-950/80 border border-emerald-700/80 text-emerald-200 hover:bg-emerald-900 transition flex flex-col items-center gap-1">
            <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-sm"></span>
            <span>VERDANT</span>
          </button>
          <button type="button" data-color="VOLT" onclick="selectColor('VOLT')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-amber-950/80 border border-amber-700/80 text-amber-200 hover:bg-amber-900 transition flex flex-col items-center gap-1">
            <span class="w-3.5 h-3.5 rounded-full bg-amber-400 shadow-sm"></span>
            <span>VOLT</span>
          </button>
          <button type="button" data-color="UMBRA" onclick="selectColor('UMBRA')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-purple-950/80 border border-purple-700/80 text-purple-200 hover:bg-purple-900 transition flex flex-col items-center gap-1">
            <span class="w-3.5 h-3.5 rounded-full bg-purple-500 shadow-sm"></span>
            <span>UMBRA</span>
          </button>
          <button type="button" data-color="LUMEN" onclick="selectColor('LUMEN')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-yellow-950/80 border border-yellow-700/80 text-yellow-200 hover:bg-yellow-900 transition flex flex-col items-center gap-1">
            <span class="w-3.5 h-3.5 rounded-full bg-yellow-300 shadow-sm"></span>
            <span>LUMEN</span>
          </button>
          <button type="button" data-color="NEUTRA" onclick="selectColor('NEUTRA')" class="px-2 py-2 rounded-xl text-xs font-semibold bg-zinc-800 border border-zinc-600 text-zinc-300 hover:bg-zinc-700 transition flex flex-col items-center gap-1">
            <span class="w-3.5 h-3.5 rounded-full bg-zinc-400 shadow-sm"></span>
            <span>NEUTRA</span>
          </button>
        </div>
      </div>

      <!-- 2. Basic Info & Header Controls -->
      <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
        <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
          <i data-lucide="file-text" class="w-4 h-4 text-amber-400"></i>
          기본 카드 정보
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
          <div class="sm:col-span-8">
            <label class="block text-xs text-zinc-400 mb-1">카드 이름</label>
            <input type="text" id="inputName" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500" value="Kindlet, the Emberling">
          </div>
          <div class="sm:col-span-4">
            <label class="block text-xs text-zinc-400 mb-1">소환 코스트 (예: 1 {IGNIS})</label>
            <input type="text" id="inputMana" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500" value="1 {IGNIS}">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
          <div class="sm:col-span-8">
            <label class="block text-xs text-zinc-400 mb-1">유형 라인 (Type Line)</label>
            <input type="text" id="inputTypeLine" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500" value="Legendary Creature — Elemental Beast">
          </div>
          <div class="sm:col-span-4">
            <label class="block text-xs text-zinc-400 mb-1">카드 등급 (7 RARITIES)</label>
            <select id="selectRarity" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500">
              <option value="common">Common (커먼)</option>
              <option value="uncommon">Uncommon (언커먼)</option>
              <option value="rare">Rare (레어)</option>
              <option value="epic">Epic (에픽)</option>
              <option value="legendary">Legendary (전설)</option>
              <option value="mythic" selected>Mythic (미식)</option>
              <option value="secret">Secret Rare (시크릿 레어)</option>
            </select>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 pt-1">
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer select-none">
            <input type="checkbox" id="toggleCrown" checked class="w-4 h-4 rounded text-amber-500 bg-zinc-950 border-zinc-700 focus:ring-0">
            <span>천상 성좌 장식(Celestial Crest) 표시</span>
          </label>
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer select-none">
            <input type="checkbox" id="togglePT" checked class="w-4 h-4 rounded text-amber-500 bg-zinc-950 border-zinc-700 focus:ring-0">
            <span>P/T 박스 표시</span>
          </label>
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer select-none">
            <input type="checkbox" id="toggleFooter" checked class="w-4 h-4 rounded text-amber-500 bg-zinc-950 border-zinc-700 focus:ring-0">
            <span>하단 메타정보 표시</span>
          </label>
          <div class="flex items-center gap-1.5 ml-auto">
            <span class="text-xs text-zinc-400">P/T:</span>
            <input type="text" id="inputPT" class="w-16 bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-center text-zinc-100 font-bold" value="2/2">
          </div>
        </div>
      </div>

      <!-- 3. Artwork Controls (5:3 Ratio) -->
      <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
            <i data-lucide="image" class="w-4 h-4 text-amber-400"></i>
            일러스트레이션 설정 (5:3 와이드 비율)
          </h2>
          <button type="button" onclick="resetArtAdjustments()" class="text-xs text-zinc-400 hover:text-zinc-200">초기화</button>
        </div>
        
        <div>
          <label class="block text-xs text-zinc-400 mb-1">이미지 파일 불러오기</label>
          <input type="file" id="inputArtFile" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-amber-400 hover:file:bg-zinc-700 cursor-pointer">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] text-zinc-400 mb-1">확대/축소 (Zoom)</label>
            <input type="range" id="inputArtZoom" min="80" max="250" value="100" class="w-full accent-amber-500">
          </div>
          <div>
            <label class="block text-[11px] text-zinc-400 mb-1">가로 위치 (X Offset)</label>
            <input type="range" id="inputArtPosX" min="0" max="100" value="50" class="w-full accent-amber-500">
          </div>
          <div>
            <label class="block text-[11px] text-zinc-400 mb-1">세로 위치 (Y Offset)</label>
            <input type="range" id="inputArtPosY" min="0" max="100" value="50" class="w-full accent-amber-500">
          </div>
        </div>
      </div>

      <!-- 4. Rules & Skills Builder (Tabs: Pokemon vs Classic) -->
      <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
            <i data-lucide="swords" class="w-4 h-4 text-amber-400"></i>
            스킬 & 규칙 서식 모드
          </h2>
          <div class="flex items-center gap-1 bg-zinc-950 p-1 rounded-lg border border-zinc-800 text-xs">
            <button type="button" id="tabModePokemon" class="px-3 py-1.5 rounded-md transition-all bg-amber-500 text-zinc-950 font-bold shadow-sm flex items-center gap-1.5">
              <i data-lucide="zap" class="w-3.5 h-3.5"></i>
              <span>스킬 분리 모드 (포켓몬풍)</span>
            </button>
            <button type="button" id="tabModeClassic" class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-1.5">
              <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
              <span>클래식 서술 모드 (오라클)</span>
            </button>
          </div>
        </div>

        <!-- Mode 1: Pokemon Style Builder -->
        <div id="sectionPokemonStyle" class="space-y-3">
          <div id="skillsList" class="space-y-3">
            <!-- Dynamic Skill Blocks generated here -->
          </div>
          <button type="button" id="btnAddSkill" class="w-full py-2 border-2 border-dashed border-zinc-700 hover:border-amber-500/60 rounded-xl text-xs font-bold text-zinc-300 hover:text-amber-400 transition flex items-center justify-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>새로운 기술 추가</span>
          </button>
        </div>

        <!-- Mode 2: Classic Free Text -->
        <div id="sectionClassicStyle" class="space-y-3 hidden">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs text-zinc-400">룰 텍스트 (줄바꿈 및 심볼 지원)</label>
              <div class="flex items-center gap-1">
                <button type="button" onclick="insertSymbol('{IGNIS}')" class="px-1.5 py-0.5 rounded bg-red-950 border border-red-800 text-[10px] text-red-300">+IGNIS</button>
                <button type="button" onclick="insertSymbol('{AQUA}')" class="px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-800 text-[10px] text-cyan-300">+AQUA</button>
                <button type="button" onclick="insertSymbol('{VERDANT}')" class="px-1.5 py-0.5 rounded bg-emerald-950 border border-emerald-800 text-[10px] text-emerald-300">+VERDANT</button>
                <button type="button" onclick="insertSymbol('{VOLT}')" class="px-1.5 py-0.5 rounded bg-amber-950 border border-amber-800 text-[10px] text-amber-300">+VOLT</button>
                <button type="button" onclick="insertSymbol('{UMBRA}')" class="px-1.5 py-0.5 rounded bg-purple-950 border border-purple-800 text-[10px] text-purple-300">+UMBRA</button>
                <button type="button" onclick="insertSymbol('{NEUTRA}')" class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-600 text-[10px] text-zinc-300">+NEUTRA</button>
                <button type="button" onclick="insertSymbol('{T}')" class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-600 text-[10px] text-zinc-300">+TAP</button>
              </div>
            </div>
            <textarea id="inputText" rows="4" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-3 text-sm text-zinc-100 font-card-body leading-relaxed focus:outline-none focus:border-amber-500">Haste
Whenever Kindlet, the Emberling attacks, it deals 1 damage to each opponent.
{IGNIS}{IGNIS}, Sacrifice Kindlet: It deals 3 damage to any target.</textarea>
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1">플레이버 텍스트 (Flavor Text)</label>
          <input type="text" id="inputFlavor" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-300 italic focus:outline-none focus:border-amber-500" value="“From the ashes, it rises again.”">
        </div>
      </div>

      <!-- 5. Card Footer Metadata -->
      <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
        <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
          <i data-lucide="tag" class="w-4 h-4 text-amber-400"></i>
          하단 메타데이터
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-[11px] text-zinc-400 mb-1">세트 코드</label>

    // 3. Mana / Energy Tokenizer
    function parseManaTokens(str) {
      if (!str || typeof str !== 'string') return [];
      const tokens = [];
      const regex = /\{([A-Za-z0-9_-]+)\}|([0-9]+)|([IAVULBWRGCTEN])/gi;
      let match;
      while ((match = regex.exec(str)) !== null) {
        if (match[1]) tokens.push(match[1].toUpperCase());
        else if (match[2]) tokens.push(match[2]);
        else if (match[3]) tokens.push(match[3].toUpperCase());
      }
      return tokens;
    }

      if (!COLOR_THEMES[colorKey]) return;

        if (btn.getAttribute('data-color') === colorKey) {
          btn.classList.add('ring-2', 'ring-white', 'scale-105', 'font-bold');

    // 8. Artwork Adjustments
    window.updateArtworkTransform = function() {
      const img = document.getElementById('renderCardArt');
      if (!img) return;
      const zoom = document.getElementById('inputArtZoom')?.value || 100;
      const posX = document.getElementById('inputArtPosX')?.value || 50;
      const posY = document.getElementById('inputArtPosY')?.value || 50;

      const scale = zoom / 100;
      const translateX = (posX - 50) * 1.5;
      const translateY = (posY - 50) * 1.5;

      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      img.style.transformOrigin = 'center center';
    };

    window.resetArtAdjustments = function() {
      const z = document.getElementById('inputArtZoom');
      const x = document.getElementById('inputArtPosX');
      const y = document.getElementById('inputArtPosY');
      if (z) z.value = 100;
      if (x) x.value = 50;
      if (y) y.value = 50;
      updateArtworkTransform();
    };

    // 9. Card Export
    window.downloadCard = function() {
      const cardEl = document.getElementById('cardPreviewTarget');
      if (!cardEl || typeof html2canvas !== 'function') return;

      const btn = document.getElementById('btnDownload');
      const origText = btn ? btn.innerHTML : '';
      if (btn) btn.innerHTML = '<span>생성 중...</span>';

      html2canvas(cardEl, {
        scale: 3,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        const name = (document.getElementById('inputName')?.value || 'card').trim().replace(/\s+/g, '_');
        link.download = `AETHERIUM_${name}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        if (btn) btn.innerHTML = origText;
      }).catch(err => {
        console.error('Export error:', err);
        if (btn) btn.innerHTML = origText;
      });
    };

    // 10. Rules Formatting
    function formatRulesText(text) {
      if (!text || typeof text !== 'string') return '';
      
      // Split by lines first
      const lines = text.split('\n');
      
      return lines.map(line => {
        if (!line.trim()) {
          return '<p class="min-h-[1.2em] leading-normal">&nbsp;</p>';
        }
        
        // Split line by symbol tokens like {IGNIS}, {AQUA}, {1}, etc.
        const parts = line.split(/(\{[A-Za-z0-9_-]+\})/g);
        const renderedLine = parts.map(part => {
          const match = part.match(/^\{([A-Za-z0-9_-]+)\}$/);
          if (match) {
            const token = match[1];
            return renderSingleManaSymbol(token, true);
          }
          // Escape regular text safely
          return part
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        }).join('');
        
        return `<p class="min-h-[1.25em] leading-relaxed">${renderedLine}</p>`;
      }).join('');
    }

    // 11. Symbol Insertion
    window.insertSymbol = function(sym) {
      if (textMode === 'pokemon') {
        if (skillsData.length > 0) {
          skillsData[skillsData.length - 1].cost = (skillsData[skillsData.length - 1].cost || '') + sym;
          renderSkillsEditor();
          updateCard();
        }
      } else {
        const ta = document.getElementById('inputText');
        if (!ta) return;
        const start = ta.selectionStart || 0;
        const end = ta.selectionEnd || 0;
        const val = ta.value;
        ta.value = val.substring(0, start) + sym + val.substring(end);
        ta.selectionStart = ta.selectionEnd = start + sym.length;
        ta.focus();
        updateCard();
      }
    };

      return skillsData.map((skill, idx) => {
        const costHtml = skill.cost ? `<div class="pokemon-energy-cost">${parseManaSymbols(skill.cost, true)}</div>` : '';
        const damageHtml = skill.damage ? `<div class="font-card-title text-xs sm:text-[13px] font-black tracking-tight text-zinc-950 ml-auto shrink-0 whitespace-nowrap">${skill.damage}</div>` : '';
        const borderClass = idx > 0 ? 'border-t border-zinc-800/15 pt-1.5' : '';
        
        let descHtml = '';
        if (skill.desc && typeof skill.desc === 'string' && skill.desc.trim()) {
          descHtml = `<div class="font-card-body text-[10px] sm:text-[10.5px] text-zinc-900 leading-snug pt-0.5">${formatRulesText(skill.desc)}</div>`;
        }

        return `
          <div class="pokemon-skill-row ${borderClass}">
            <div class="pokemon-skill-header">
              ${costHtml}
              <div class="font-card-title text-[11.5px] sm:text-[12.5px] font-extrabold tracking-tight text-zinc-950 flex-1 min-w-0 truncate">
                ${skill.name || '기술명'}
              </div>
              ${damageHtml}
            </div>
            ${descHtml}
          </div>
        `;
      }).join('');
    }

    // 13. Render Skills Form Editor
    function renderSkillsEditor() {
      const container = document.getElementById('skillsList');
      if (!container) return;
      container.innerHTML = '';

      skillsData.forEach((skill, index) => {
        const card = document.createElement('div');
        card.className = 'p-3 bg-zinc-900 rounded-xl border border-zinc-700/80 space-y-2 relative';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-amber-400">기술 #${index + 1}</span>
            <button type="button" class="text-xs text-rose-400 hover:text-rose-300 font-semibold transition" onclick="removeSkill(${index})">삭제</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="block text-[10px] text-zinc-400 mb-0.5">에너지 코스트 (예: {IGNIS}{IGNIS})</label>
              <input type="text" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-zinc-100" 
                value="${skill.cost || ''}" oninput="updateSkillField(${index}, 'cost', this.value)">
            </div>
            <div>
              <label class="block text-[10px] text-zinc-400 mb-0.5">기술 이름</label>
              <input type="text" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-zinc-100 font-semibold" 
                value="${skill.name || ''}" oninput="updateSkillField(${index}, 'name', this.value)">
            </div>
            <div>
              <label class="block text-[10px] text-zinc-400 mb-0.5">데미지 (예: 20, 80+, -)</label>
              <input type="text" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-zinc-100 font-bold" 
                value="${skill.damage || ''}" oninput="updateSkillField(${index}, 'damage', this.value)">
            </div>
          </div>
          <div>
            <label class="block text-[10px] text-zinc-400 mb-0.5">기술 설명 및 추가 효과</label>
            <textarea rows="1" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-1.5 text-xs text-zinc-100" 
              oninput="updateSkillField(${index}, 'desc', this.value)">${skill.desc || ''}</textarea>
          </div>
          <div class="flex items-center gap-1 pt-1 flex-wrap">
            <span class="text-[9px] text-zinc-500">코스트 추가:</span>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-rose-300" onclick="appendSkillCost(${index}, '{IGNIS}')">+IGNIS</button>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-sky-300" onclick="appendSkillCost(${index}, '{AQUA}')">+AQUA</button>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-emerald-300" onclick="appendSkillCost(${index}, '{VERDANT}')">+VERDANT</button>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-amber-300" onclick="appendSkillCost(${index}, '{VOLT}')">+VOLT</button>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-purple-300" onclick="appendSkillCost(${index}, '{UMBRA}')">+UMBRA</button>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-yellow-300" onclick="appendSkillCost(${index}, '{LUMEN}')">+LUMEN</button>
            <button type="button" class="px-1.5 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-zinc-300" onclick="appendSkillCost(${index}, '{NEUTRA}')">+NEUTRA</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.updateSkillField = function(index, field, value) {
      if (skillsData && skillsData[index]) {
        skillsData[index][field] = value;
        updateCard();
      }
    };

    window.appendSkillCost = function(index, symbol) {
      if (skillsData && skillsData[index]) {
        skillsData[index].cost = (skillsData[index].cost || '') + symbol;
        renderSkillsEditor();
        updateCard();
      }
    };

    window.removeSkill = function(index) {
      if (skillsData && skillsData.length > index) {
        skillsData.splice(index, 1);
        renderSkillsEditor();
        updateCard();
      }
    };

    // 14. Realtime Card Preview Update
    function updateCard() {
      try {
        // 1. Name & Mana
        const name = document.getElementById('inputName')?.value || 'Untitled';
        const renderNameEl = document.getElementById('renderCardName');
        if (renderNameEl) renderNameEl.textContent = name;

        const manaVal = document.getElementById('inputMana')?.value || '';
        const renderManaEl = document.getElementById('renderManaCost');
        if (renderManaEl) renderManaEl.innerHTML = parseManaSymbols(manaVal, false);

        // 2. Type & Rarity
        const typeLine = document.getElementById('inputTypeLine')?.value || 'Card';
        const renderTypeEl = document.getElementById('renderTypeLine');
        if (renderTypeEl) renderTypeEl.textContent = typeLine;

        const rarity = document.getElementById('selectRarity')?.value || 'mythic';
        const renderSetSymbolEl = document.getElementById('renderSetSymbol');
        if (renderSetSymbolEl) {
          renderSetSymbolEl.innerHTML = RARITY_SVGS[rarity] || RARITY_SVGS.mythic;
        }

        const holoStamp = document.getElementById('renderHoloStamp');
        if (holoStamp) {
          holoStamp.style.display = ['rare', 'epic', 'legendary', 'mythic', 'secret'].includes(rarity) ? 'flex' : 'none';
        }

        // 3. Text Body
        const rulesContainer = document.getElementById('renderRulesText');
        if (rulesContainer) {
          if (textMode === 'pokemon') {
            rulesContainer.innerHTML = renderPokemonSkills();
          } else {
            const rules = document.getElementById('inputText')?.value || '';
            rulesContainer.innerHTML = formatRulesText(rules);
          }
        }

        const flavor = document.getElementById('inputFlavor')?.value || '';
        const flavorContainer = document.getElementById('renderFlavorContainer');
        const flavorEl = document.getElementById('renderFlavorText');
        if (flavorContainer && flavorEl) {
          if (flavor.trim()) {
            flavorContainer.style.display = 'block';
            flavorEl.textContent = flavor;
          } else {
            flavorContainer.style.display = 'none';
          }
        }

        // 4. P/T Plaque
        const ptBox = document.getElementById('renderPTBox');
        const ptToggle = document.getElementById('togglePT');
        if (ptBox && ptToggle) {
          if (ptToggle.checked) {
            ptBox.style.display = 'flex';
            const ptVal = document.getElementById('inputPT')?.value || '2/2';
            const renderPTValEl = document.getElementById('renderPTVal');
            if (renderPTValEl) renderPTValEl.textContent = ptVal;
          } else {
            ptBox.style.display = 'none';
          }
        }

        // 5. Celestial Star Crest
        const crownToggle = document.getElementById('toggleCrown');
        const crownWrapper = document.getElementById('renderCrownWrapper');
        if (crownWrapper && crownToggle) {
          crownWrapper.style.display = crownToggle.checked ? 'block' : 'none';
        }

        // 6. Metadata Footer
        const footerToggle = document.getElementById('toggleFooter');
        const footerBar = document.getElementById('renderFooterBar');
        if (footerBar && footerToggle) {
          footerBar.style.display = footerToggle.checked ? 'flex' : 'none';
        }

        const setCode = document.getElementById('inputSetCode')?.value || 'GEN';
        const langCode = document.getElementById('inputLang')?.value || 'EN';
        const artist = document.getElementById('inputArtist')?.value || 'Lucas Graciano';
        const copyright = document.getElementById('inputCopyright')?.value || '™ & © 2026 AETHERIUM';

        const setLangEl = document.getElementById('renderSetAndLang');
        if (setLangEl) setLangEl.textContent = `${setCode} • ${langCode}`;

        const artistEl = document.getElementById('renderArtist');
        if (artistEl) artistEl.textContent = artist;

        const copyEl = document.getElementById('renderCopyright');
        if (copyEl) copyEl.textContent = copyright;

      } catch (err) {
        console.error('Update error:', err);
      }
    }

    // 15. Setup Listeners
    function setupApp() {
      // Inputs binding
      const inputIds = [
        'inputName', 'inputMana', 'inputTypeLine', 'selectRarity',
        'inputText', 'inputFlavor', 'togglePT', 'inputPT', 'toggleCrown', 'toggleFooter',
        'inputSetCode', 'inputLang', 'inputArtist', 'inputCopyright'
      ];
      inputIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', updateCard);
          el.addEventListener('change', updateCard);
        }
      });

      // Artwork zoom & position sliders
      ['inputArtZoom', 'inputArtPosX', 'inputArtPosY'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', updateArtworkTransform);
        }
      });

      // Artwork local file upload
      const artFileInput = document.getElementById('inputArtFile');
      if (artFileInput) {
        artFileInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = document.getElementById('renderCardArt');
            if (img && ev.target?.result) {
              img.src = ev.target.result;
              resetArtAdjustments();
            }
          };
          reader.readAsDataURL(file);
        });
      }

      // Pokemon vs Classic mode tabs
      const tabPokemon = document.getElementById('tabModePokemon');
      const tabClassic = document.getElementById('tabModeClassic');
      const secPokemon = document.getElementById('sectionPokemonStyle');
      const secClassic = document.getElementById('sectionClassicStyle');

      if (tabPokemon && tabClassic && secPokemon && secClassic) {
        tabPokemon.addEventListener('click', () => {
          textMode = 'pokemon';
          secPokemon.classList.remove('hidden');
          secClassic.classList.add('hidden');
          tabPokemon.className = 'px-3 py-1.5 rounded-md transition-all bg-amber-500 text-zinc-950 font-bold shadow-sm flex items-center gap-1.5';
          tabClassic.className = 'px-3 py-1.5 rounded-md text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-1.5';
          updateCard();
        });

        tabClassic.addEventListener('click', () => {
          textMode = 'classic';
          secClassic.classList.remove('hidden');
          secPokemon.classList.add('hidden');
          tabClassic.className = 'px-3 py-1.5 rounded-md transition-all bg-amber-500 text-zinc-950 font-bold shadow-sm flex items-center gap-1.5';
          tabPokemon.className = 'px-3 py-1.5 rounded-md text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-1.5';
          updateCard();
        });
      }

      // Add new skill button
      const btnAddSkill = document.getElementById('btnAddSkill');
      if (btnAddSkill) {
        btnAddSkill.addEventListener('click', () => {
          skillsData.push({
            cost: `{${currentColor}}`,
            name: '새로운 기술',
            damage: '30',
            desc: '기술 효과를 입력하세요.'
          });
          renderSkillsEditor();
          updateCard();
        });
      }

      // Render Lucide icons
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }

      // Initialize defaults
      selectColor('UMBRA');
      renderSkillsEditor();
      updateCard();
      updateArtworkTransform();
    }

    // Run setup on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupApp);
    } else {
      setupApp();
    }
  </script>
</body>
</html>
